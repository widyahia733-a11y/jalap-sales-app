  <!-- مسح أي Service Worker أو كاش قديم فوراً لمنع بقاء النسخة القديمة على الجوال -->
  <script>
    (function clearLegacyServiceWorkerAndCache() {
      try {
        const CURRENT_BUILD_VERSION = 'jalap_v2026_11_14_r2';
        const storedVersion = localStorage.getItem('jalap_build_version');

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }

        if ('caches' in window && storedVersion !== CURRENT_BUILD_VERSION) {
          caches.keys().then(function(cacheNames) {
            return Promise.all(
              cacheNames.map(function(cacheName) {
                return caches.delete(cacheName);
              })
            );
          }).then(function() {
            localStorage.setItem('jalap_build_version', CURRENT_BUILD_VERSION);
            if (storedVersion !== null) {
              window.location.reload();
            }
          });
        } else {
          localStorage.setItem('jalap_build_version', CURRENT_BUILD_VERSION);
        }
      } catch (e) {
        console.warn('Cache cleanup warning:', e);
      }
    })();
  </script>

  <!-- ضبط أبعاد واتجاه جذر الويب لمنع انزياح عناصر Flutter على شاشات الجوال وإخفاء شارة Netlify -->

<body dir="ltr">
  <script>
    // إزالة أي عنصر عائم خاص بـ Netlify يتم حقنه ديناميكياً في الصفحة
    (function removeNetlifyBadges() {
      const selectors = [
        'div[data-netlify-deploy-notifications]',
        'div[data-netlify-cdp]',
        'netlify-drawer',
        'netlify-widget',
        'iframe[src*="netlify"]',
        'iframe[title*="Netlify"]',
        '#netlify-badge',
        '.netlify-badge'
      ].join(',');

      function clean() {
        document.querySelectorAll(selectors).forEach(function(el) {
          el.remove();
        });
      }

      clean();
      if (typeof MutationObserver !== 'undefined') {
        const observer = new MutationObserver(clean);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      }
    })();

    window.addEventListener('load', function(ev) {
      // تحميل main.dart.js مباشرة بدون Service Worker مع رقم إصدار لكسر الكاش
      _flutter.loader.loadEntrypoint({
        entrypointUrl: "main.dart.js?v=20261114r2",
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
