[build]
  publish = "build/web"
  command = "echo 'Deploying prebuilt Flutter Web bundle from build/web'"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
